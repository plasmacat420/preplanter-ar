<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>button_glass_01 — AR test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: monospace; color: #fff; }

    #info {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      font-size: 13px; text-align: center; white-space: nowrap;
      background: rgba(0,0,0,0.55); padding: 6px 16px; border-radius: 20px;
      pointer-events: none; z-index: 10;
    }

    #ARButton {
      position: fixed !important;
      bottom: 28px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      z-index: 10 !important;
    }
  </style>
</head>
<body>
  <div id="info">Loading GLB…</div>

  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE       from 'three';
  import { GLTFLoader }   from 'three/addons/loaders/GLTFLoader.js';
  import { ARButton }     from 'three/addons/webxr/ARButton.js';

  const info  = document.getElementById('info');
  const clock = new THREE.Clock();

  // ── Renderer ───────────────────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // ── Scene ──────────────────────────────────────────────────────────────────
  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);

  // Hemisphere gives a top-to-bottom gradient that reads as depth on the backplate.
  // Ground color is cool-dark to subtly differentiate bottom rim from face.
  scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 0.40));
  scene.add(new THREE.AmbientLight(0xffffff, 0.15));

  // ── Placement constants ────────────────────────────────────────────────────
  const PLACE_DISTANCE = 0.50;   // metres in front of camera
  const PLACE_DROP     = 0.07;   // metres below camera eye-level

  // ── Re-acquisition constants ───────────────────────────────────────────────
  const TRIGGER_DEG    = 28;     // start dwell timer above this angle
  const RESET_DEG      = 20;     // reset dwell timer below this angle (hysteresis)
  const OCCLUDE_DEG    = 90;     // immediate re-acquire — UI is fully out of view
  const DWELL_TIME     = 1.1;    // seconds outside TRIGGER_DEG before re-acquiring
  const ANIM_DURATION  = 0.45;   // seconds for re-acquire animation

  // ── State ──────────────────────────────────────────────────────────────────
  let isPlaced    = false;
  let isAnimating = false;
  let dwellTimer  = 0;
  let animProgress = 0;

  // ── Load GLB ───────────────────────────────────────────────────────────────
  let mixer    = null;
  let button3d = null;

  new GLTFLoader().load('./button_glass_01.glb', gltf => {
    button3d = gltf.scene;

    // Fix transparent draw order
    const ORDER = { glass_back: 1, glass_rim: 2, glass_face: 3 };
    button3d.traverse(child => {
      if (!child.isMesh) return;
      child.material.depthWrite = false;
      child.renderOrder         = ORDER[child.material.name] ?? 2;
    });

    // Start idle_float animation
    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(button3d);
      const action = mixer.clipAction(gltf.animations[0]);
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.play();
    }

    info.textContent = 'Tap "Start AR" → tap to place';
  },
  undefined,
  err => { info.textContent = 'Load error — see console'; console.error(err); });

  // ── AR button — no hit-test required ──────────────────────────────────────
  document.body.appendChild(
    ARButton.createButton(renderer, {
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.body },
    })
  );

  renderer.xr.addEventListener('sessionstart', () => {
    info.textContent = 'Tap to place';
  });
  renderer.xr.addEventListener('sessionend', () => {
    isPlaced = false;
    isAnimating = false;
    dwellTimer = 0;
    info.textContent = 'AR session ended';
  });

  // ── Reusable allocation — avoid GC pressure in render loop ────────────────
  const _camPos       = new THREE.Vector3();
  const _forward      = new THREE.Vector3();
  const _toButton     = new THREE.Vector3();
  const _animStartPos = new THREE.Vector3();
  const _animTargetPos = new THREE.Vector3();
  const _animStartQuat = new THREE.Quaternion();
  const _animTargetQuat = new THREE.Quaternion();
  const _lookProxy    = new THREE.Object3D(); // scratch object for lookAt → quaternion

  // ── Placement helpers ──────────────────────────────────────────────────────
  function getCameraForward() {
    renderer.xr.getCamera().getWorldPosition(_camPos);
    renderer.xr.getCamera().getWorldDirection(_forward);
    _forward.y = 0;
    _forward.normalize();
  }

  function computeComfortTarget() {
    getCameraForward();
    _animTargetPos.set(
      _camPos.x + _forward.x * PLACE_DISTANCE,
      _camPos.y - PLACE_DROP,
      _camPos.z + _forward.z * PLACE_DISTANCE
    );
    _lookProxy.position.copy(_animTargetPos);
    _lookProxy.lookAt(_camPos.x, _animTargetPos.y, _camPos.z);
    _animTargetQuat.copy(_lookProxy.quaternion);
  }

  // Instant snap — first placement only
  function placeAtCamera() {
    if (!button3d) return;
    getCameraForward();
    button3d.position.set(
      _camPos.x + _forward.x * PLACE_DISTANCE,
      _camPos.y - PLACE_DROP,
      _camPos.z + _forward.z * PLACE_DISTANCE
    );
    button3d.lookAt(_camPos.x, button3d.position.y, _camPos.z);
    if (!button3d.parent) scene.add(button3d);
    isPlaced    = true;
    isAnimating = false;
    dwellTimer  = 0;
    info.textContent = 'Placed — tap to reposition';
  }

  // Animated re-acquire — used for auto and manual reposition after first place
  function startReacquire() {
    computeComfortTarget();
    _animStartPos.copy(button3d.position);
    _animStartQuat.copy(button3d.quaternion);
    animProgress = 0;
    isAnimating  = true;
    dwellTimer   = 0;
  }

  // ── Tap handler ────────────────────────────────────────────────────────────
  renderer.domElement.addEventListener('click', () => {
    if (!renderer.xr.isPresenting || !button3d) return;
    if (!isPlaced) {
      placeAtCamera();           // first tap: instant snap
    } else {
      startReacquire();          // subsequent taps: smooth re-acquire
      info.textContent = 'Repositioning…';
    }
  });

  // ── Render loop ────────────────────────────────────────────────────────────
  renderer.setAnimationLoop(() => {
    const delta = clock.getDelta();
    if (mixer) mixer.update(delta);

    if (isPlaced && renderer.xr.isPresenting) {
      if (isAnimating) {
        // Advance ease-out animation toward comfort target
        animProgress += delta / ANIM_DURATION;
        if (animProgress >= 1) {
          animProgress = 1;
          isAnimating  = false;
          info.textContent = 'Placed — tap to reposition';
        }
        const t = 1 - (1 - animProgress) * (1 - animProgress); // ease-out
        button3d.position.lerpVectors(_animStartPos, _animTargetPos, t);
        button3d.quaternion.slerpQuaternions(_animStartQuat, _animTargetQuat, t);

      } else {
        // Check angle from camera forward to button
        renderer.xr.getCamera().getWorldPosition(_camPos);
        renderer.xr.getCamera().getWorldDirection(_forward);
        _forward.y = 0;
        _forward.normalize();

        _toButton.copy(button3d.position).sub(_camPos);
        _toButton.y = 0;
        if (_toButton.lengthSq() > 0.0001) _toButton.normalize();

        const dot   = THREE.MathUtils.clamp(_toButton.dot(_forward), -1, 1);
        const angle = Math.acos(dot) * THREE.MathUtils.RAD2DEG;

        if (angle > OCCLUDE_DEG) {
          // UI is fully behind — re-acquire immediately, no dwell
          startReacquire();
          info.textContent = 'Re-acquiring…';
        } else if (angle > TRIGGER_DEG) {
          dwellTimer += delta;
          if (dwellTimer >= DWELL_TIME) {
            startReacquire();
            info.textContent = 'Re-acquiring…';
          }
        } else if (angle < RESET_DEG) {
          dwellTimer = 0; // hysteresis: only reset inside inner threshold
        }
        // Between RESET_DEG and TRIGGER_DEG: hold timer without change
      }
    }

    renderer.render(scene, camera);
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
