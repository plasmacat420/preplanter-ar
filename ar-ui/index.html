<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>button_glass_01 — AR test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: monospace; color: #fff; }

    #info {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      font-size: 13px; text-align: center; white-space: nowrap;
      background: rgba(0,0,0,0.55); padding: 6px 16px; border-radius: 20px;
      pointer-events: none; z-index: 10;
    }

    #ARButton {
      position: fixed !important;
      bottom: 28px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      z-index: 10 !important;
    }
  </style>
</head>
<body>
  <div id="info">Loading GLB…</div>

  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE       from 'three';
  import { GLTFLoader }   from 'three/addons/loaders/GLTFLoader.js';
  import { ARButton }     from 'three/addons/webxr/ARButton.js';

  const info  = document.getElementById('info');
  const clock = new THREE.Clock();

  // ── Renderer ───────────────────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // ── Scene ──────────────────────────────────────────────────────────────────
  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);

  // Hemisphere gives a top-to-bottom gradient that reads as depth on the backplate.
  // Ground color is cool-dark to subtly differentiate bottom rim from face.
  scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 0.40));
  scene.add(new THREE.AmbientLight(0xffffff, 0.15));

  // ── Placement constants ────────────────────────────────────────────────────
  const PLACE_DISTANCE = 0.50;   // metres in front of camera
  const PLACE_DROP     = 0.07;   // metres below camera eye-level
  const FACE_TILT      = 22;     // degrees — face tilts this far from perfect billboard

  // ── Interaction constants ─────────────────────────────────────────────────
  const TAP_PRESS_DUR   = 0.12;  // seconds to scale down on tap
  const TAP_RELEASE_DUR = 0.18;  // seconds to return to normal scale
  const TAP_SCALE       = 0.90;  // scale at peak of press
  const RIM_BASE        = 2.8;   // rim emissive base (matches GLB spec)
  const RIM_PULSE_AMP   = 0.30;  // ±amplitude of idle emissive variation
  const RIM_PULSE_HZ    = 0.40;  // Hz — ~2.5s period, desync from float animation
  const RIM_PRESS_BOOST  = 1.5;  // additive emissive boost at full press — stacks on idle pulse
  const TARGET_ZONE_DEG  = 12;  // degrees from camera forward to count as "targeted"
  const TARGET_BOOST     = 0.5; // rim emissive boost when button is in targeting zone

  // ── Re-acquisition constants ───────────────────────────────────────────────
  const TRIGGER_DEG    = 28;     // start dwell timer above this angle
  const RESET_DEG      = 20;     // reset dwell timer below this angle (hysteresis)
  const OCCLUDE_DEG    = 90;     // immediate re-acquire — UI is fully out of view
  const DWELL_TIME     = 1.1;    // seconds outside TRIGGER_DEG before re-acquiring
  const ANIM_DURATION  = 0.45;   // seconds for re-acquire animation

  // ── State ──────────────────────────────────────────────────────────────────
  let isPlaced    = false;
  let isAnimating = false;
  let dwellTimer  = 0;
  let animProgress = 0;
  let tapT           = 0;     // 0 = full size, 1 = fully pressed (TAP_SCALE)
  let tapping        = false; // true during press phase
  let targetingFactor = 0;   // 0 = not aimed at button, 1 = centered on button

  // ── Load GLB ───────────────────────────────────────────────────────────────
  let mixer    = null;
  let button3d = null;
  let rimMat   = null;  // reference for per-frame emissive
  let faceMat  = null;  // reference for per-frame emissive

  new GLTFLoader().load('./button_glass_01.glb', gltf => {
    button3d = gltf.scene;

    // Fix transparent draw order + perceptual contrast tuning
    const ORDER = { glass_back: 1, glass_rim: 2, glass_face: 3 };
    button3d.traverse(child => {
      if (!child.isMesh) return;
      child.material.depthWrite = false;
      child.renderOrder         = ORDER[child.material.name] ?? 2;
      if (child.material.name === 'glass_rim') {
        rimMat = child.material; // store for idle emissive pulse
      }
      if (child.material.name === 'glass_face') {
        faceMat = child.material;
        child.material.opacity          = 0.65;
        child.material.emissive         = new THREE.Color(0x334466);
        child.material.emissiveIntensity = 0.12;
      }
    });

    // Canvas label — "Enter" centered on face
    (function addLabel() {
      const canvas = document.createElement('canvas');
      canvas.width  = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 512, 128);
      ctx.fillStyle    = 'rgba(255, 255, 255, 0.90)';
      ctx.font         = '500 64px system-ui, sans-serif';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Enter', 256, 64);

      const geo = new THREE.PlaneGeometry(0.08, 0.02);
      geo.rotateX(-Math.PI / 2); // lay flat in XZ plane so normal = +Y (matches face)
      const mat = new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(canvas),
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
      });
      const label = new THREE.Mesh(geo, mat);
      label.renderOrder = 4;    // above face (3), rim (2), back (1)
      label.position.y  = 0.014; // 14mm above button origin — extra clearance to avoid z-fighting
      button3d.add(label);
    })();

    // Start idle_float animation
    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(button3d);
      const action = mixer.clipAction(gltf.animations[0]);
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.play();
    }

    info.textContent = 'Tap "Start AR" → tap to place';
  },
  undefined,
  err => { info.textContent = 'Load error — see console'; console.error(err); });

  // ── AR button — no hit-test required ──────────────────────────────────────
  document.body.appendChild(
    ARButton.createButton(renderer, {
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.body },
    })
  );

  renderer.xr.addEventListener('sessionstart', () => {
    info.textContent = 'Tap to place';
  });
  renderer.xr.addEventListener('sessionend', () => {
    isPlaced        = false;
    isAnimating     = false;
    dwellTimer      = 0;
    tapping         = false;
    tapT            = 0;
    targetingFactor = 0;
    if (button3d) {
      button3d.scale.setScalar(1);
      if (button3d.parent) scene.remove(button3d); // clean removal so re-entry is fresh
    }
    info.textContent = 'AR session ended';
  });

  // End XR session cleanly when page is hidden (back button, app switch, reload)
  window.addEventListener('pagehide', () => {
    const session = renderer.xr.getSession();
    if (session) session.end();
  });

  // ── Reusable allocation — avoid GC pressure in render loop ────────────────
  const _camPos       = new THREE.Vector3();
  const _forward      = new THREE.Vector3();
  const _toButton     = new THREE.Vector3();
  const _animStartPos = new THREE.Vector3();
  const _animTargetPos = new THREE.Vector3();
  const _animStartQuat = new THREE.Quaternion();
  const _animTargetQuat = new THREE.Quaternion();
  const _lookProxy    = new THREE.Object3D(); // scratch object for lookAt → quaternion
  const _raycaster    = new THREE.Raycaster();
  const _pointer      = new THREE.Vector2();

  // ── Placement helpers ──────────────────────────────────────────────────────
  function getCameraForward() {
    renderer.xr.getCamera().getWorldPosition(_camPos);
    renderer.xr.getCamera().getWorldDirection(_forward);
    _forward.y = 0;
    _forward.normalize();
  }

  // The glass face is the +Y axis in Three.js space (Blender +Z → GLTF +Y).
  // lookAt aligns -Z toward the target, so we post-multiply a local-X rotation
  // to bring +Y (the face) toward the camera, then back off by FACE_TILT degrees.
  // R_x(+90° + FACE_TILT) = R_x(+112°) at the current 22° tilt.
  // Sign is +90° (not -90°) because the face normal in this GLB is inverted
  // relative to the expected +Y direction — a 180° flip from the theoretical value.
  const _faceCorrection = new THREE.Quaternion().setFromAxisAngle(
    new THREE.Vector3(1, 0, 0),
    THREE.MathUtils.degToRad(90 + FACE_TILT)
  );
  function setComfortRotation(obj, camPos) {
    obj.lookAt(camPos.x, obj.position.y, camPos.z); // Y-axis billboard base
    obj.quaternion.multiply(_faceCorrection);        // bring face toward camera + tilt
  }

  function computeComfortTarget() {
    getCameraForward();
    _animTargetPos.set(
      _camPos.x + _forward.x * PLACE_DISTANCE,
      _camPos.y - PLACE_DROP,
      _camPos.z + _forward.z * PLACE_DISTANCE
    );
    _lookProxy.position.copy(_animTargetPos);
    setComfortRotation(_lookProxy, _camPos);
    _animTargetQuat.copy(_lookProxy.quaternion);
  }

  // Instant snap — first placement only
  function placeAtCamera() {
    if (!button3d) return;
    getCameraForward();
    button3d.position.set(
      _camPos.x + _forward.x * PLACE_DISTANCE,
      _camPos.y - PLACE_DROP,
      _camPos.z + _forward.z * PLACE_DISTANCE
    );
    setComfortRotation(button3d, _camPos);
    if (!button3d.parent) scene.add(button3d);
    isPlaced    = true;
    isAnimating = false;
    dwellTimer  = 0;
    info.textContent = 'Placed — tap to reposition';
  }

  // Animated re-acquire — used for auto and manual reposition after first place
  function startReacquire() {
    computeComfortTarget();
    _animStartPos.copy(button3d.position);
    _animStartQuat.copy(button3d.quaternion);
    animProgress = 0;
    isAnimating  = true;
    dwellTimer   = 0;
  }

  // ── Tap handler ────────────────────────────────────────────────────────────
  renderer.domElement.addEventListener('click', event => {
    if (!renderer.xr.isPresenting || !button3d) return;

    if (!isPlaced) {
      placeAtCamera(); // first tap: no button in scene yet, place unconditionally
      return;
    }

    // Raycast from tap position — only respond if the button is actually hit
    const rect = renderer.domElement.getBoundingClientRect();
    _pointer.set(
      ((event.clientX - rect.left) / rect.width)  *  2 - 1,
      ((event.clientY - rect.top)  / rect.height) * -2 + 1
    );
    // Use the XR sub-camera (first eye) for correct projection in mono phone AR
    const xrCam = renderer.xr.getCamera();
    const cam   = (xrCam.cameras && xrCam.cameras.length > 0) ? xrCam.cameras[0] : xrCam;
    _raycaster.setFromCamera(_pointer, cam);

    if (_raycaster.intersectObject(button3d, true).length === 0) return; // missed

    tapping = true; tapT = 0;
    startReacquire();
    info.textContent = 'Repositioning…';
  });

  // ── Render loop ────────────────────────────────────────────────────────────
  renderer.setAnimationLoop(() => {
    const delta = clock.getDelta();
    if (mixer) mixer.update(delta);

    if (isPlaced && renderer.xr.isPresenting) {
      if (isAnimating) {
        // Advance ease-out animation toward comfort target
        animProgress += delta / ANIM_DURATION;
        if (animProgress >= 1) {
          animProgress = 1;
          isAnimating  = false;
          info.textContent = 'Placed — tap to reposition';
        }
        const t = 1 - (1 - animProgress) * (1 - animProgress); // ease-out
        button3d.position.lerpVectors(_animStartPos, _animTargetPos, t);
        button3d.quaternion.slerpQuaternions(_animStartQuat, _animTargetQuat, t);
        targetingFactor *= Math.max(0, 1 - delta * 6.0); // fade targeting while animating

      } else {
        // Check angle from camera forward to button
        renderer.xr.getCamera().getWorldPosition(_camPos);
        renderer.xr.getCamera().getWorldDirection(_forward);
        _forward.y = 0;
        _forward.normalize();

        _toButton.copy(button3d.position).sub(_camPos);
        _toButton.y = 0;
        if (_toButton.lengthSq() > 0.0001) _toButton.normalize();

        const dot   = THREE.MathUtils.clamp(_toButton.dot(_forward), -1, 1);
        const angle = Math.acos(dot) * THREE.MathUtils.RAD2DEG;

        if (angle > OCCLUDE_DEG) {
          startReacquire();
          info.textContent = 'Re-acquiring…';
        } else if (angle > TRIGGER_DEG) {
          dwellTimer += delta;
          if (dwellTimer >= DWELL_TIME) {
            startReacquire();
            info.textContent = 'Re-acquiring…';
          }
        } else if (angle < RESET_DEG) {
          dwellTimer = 0;
        }

        // Targeting cue — smoothly track whether button is centered in view
        const targetGoal = angle < TARGET_ZONE_DEG ? 1.0 : 0.0;
        targetingFactor += (targetGoal - targetingFactor) * Math.min(delta * 8.0, 1.0);
      }
    }

    // ── Tap scale feedback ──────────────────────────────────────────────────
    if (button3d && isPlaced) {
      if (tapping) {
        tapT = Math.min(tapT + delta / TAP_PRESS_DUR, 1);
        if (tapT >= 1) tapping = false;
      } else if (tapT > 0) {
        tapT = Math.max(tapT - delta / TAP_RELEASE_DUR, 0);
      }
      button3d.scale.setScalar(1 - (1 - TAP_SCALE) * tapT);
    }

    // ── Emissive: idle pulse + targeting cue + press flare ─────────────────────
    if (rimMat) {
      rimMat.emissiveIntensity = RIM_BASE
        + RIM_PULSE_AMP  * Math.sin(clock.elapsedTime * Math.PI * 2 * RIM_PULSE_HZ)
        + TARGET_BOOST   * targetingFactor   // subtle brightening when aimed at button
        + RIM_PRESS_BOOST * tapT;            // flare on press
    }
    if (faceMat) {
      faceMat.emissiveIntensity = 0.12 + 0.10 * targetingFactor; // face brightens slightly when targeted
    }

    renderer.render(scene, camera);
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
