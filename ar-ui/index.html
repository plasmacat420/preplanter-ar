<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>button_glass_01 — AR test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: monospace; color: #fff; }

    #info {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      font-size: 13px; text-align: center; white-space: nowrap;
      background: rgba(0,0,0,0.55); padding: 6px 16px; border-radius: 20px;
      pointer-events: none; z-index: 10;
    }

    #ARButton {
      position: fixed !important;
      bottom: 28px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      z-index: 10 !important;
    }
  </style>
</head>
<body>
  <div id="info">Loading GLB…</div>

  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE       from 'three';
  import { GLTFLoader }   from 'three/addons/loaders/GLTFLoader.js';
  import { ARButton }     from 'three/addons/webxr/ARButton.js';

  const info  = document.getElementById('info');
  const clock = new THREE.Clock();

  // ── Renderer ───────────────────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // ── Scene ──────────────────────────────────────────────────────────────────
  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));

  // ── Placement constants ────────────────────────────────────────────────────
  const PLACE_DISTANCE = 0.55;  // metres in front of camera
  const PLACE_DROP     = 0.08;  // metres below camera eye-level

  // ── Load GLB ───────────────────────────────────────────────────────────────
  let mixer    = null;
  let button3d = null;

  new GLTFLoader().load('./button_glass_01.glb', gltf => {
    button3d = gltf.scene;

    // Fix transparent draw order
    const ORDER = { glass_back: 1, glass_rim: 2, glass_face: 3 };
    button3d.traverse(child => {
      if (!child.isMesh) return;
      child.material.depthWrite = false;
      child.renderOrder         = ORDER[child.material.name] ?? 2;
    });

    // Start idle_float animation
    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(button3d);
      const action = mixer.clipAction(gltf.animations[0]);
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.play();
    }

    info.textContent = 'Tap "Start AR" → tap anywhere to place';
  },
  undefined,
  err => { info.textContent = 'Load error — see console'; console.error(err); });

  // ── AR button — no hit-test required ──────────────────────────────────────
  document.body.appendChild(
    ARButton.createButton(renderer, {
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.body },
    })
  );

  renderer.xr.addEventListener('sessionstart', () => {
    info.textContent = 'Tap to place';
  });
  renderer.xr.addEventListener('sessionend', () => {
    info.textContent = 'AR session ended';
  });

  // ── Camera-relative placement ──────────────────────────────────────────────
  // Reusable vectors — allocated once to avoid GC pressure
  const _camPos  = new THREE.Vector3();
  const _forward = new THREE.Vector3();

  function placeAtCamera() {
    if (!button3d) return;

    const xrCam = renderer.xr.getCamera();
    xrCam.getWorldPosition(_camPos);
    xrCam.getWorldDirection(_forward);

    // Flatten to horizontal so the button doesn't tilt with head pitch
    _forward.y = 0;
    _forward.normalize();

    button3d.position.set(
      _camPos.x + _forward.x * PLACE_DISTANCE,
      _camPos.y - PLACE_DROP,
      _camPos.z + _forward.z * PLACE_DISTANCE
    );

    // Rotate to face the camera around the Y axis only (stays upright)
    button3d.lookAt(_camPos.x, button3d.position.y, _camPos.z);

    if (!button3d.parent) scene.add(button3d);

    info.textContent = 'Tap to reposition';
  }

  renderer.domElement.addEventListener('click', () => {
    if (!renderer.xr.isPresenting) return;
    placeAtCamera();
  });

  // ── Render loop ────────────────────────────────────────────────────────────
  renderer.setAnimationLoop((_, _frame) => {
    if (mixer) mixer.update(clock.getDelta());
    renderer.render(scene, camera);
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
